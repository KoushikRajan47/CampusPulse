name: CI Build & Type Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Run TypeScript Type Check & Build
      run: |
        cd frontend
        npm run build

    - name: Check Backend Syntax
      run: |
        node --check src/server.js
        node --check src/routes/campusRoutes.js
        node --check src/services/academiaClient.js
        node --check src/services/odAuditor.js
        node --check src/services/clashSimulator.js
